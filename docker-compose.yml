services:
  db:
    image: postgres:16-alpine
    container_name: kim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kim
      POSTGRES_PASSWORD: kim
      POSTGRES_DB: kim
    ports:
      - "5432:5432"
    volumes:
      - kim_pgdata:/var/lib/postgresql/data

volumes:
  kim_pgdata:
